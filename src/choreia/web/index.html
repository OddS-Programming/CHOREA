<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>χορεία</title>
<link rel="icon" href="/static/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">χορεία</span>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item active" data-view="library">
        <span class="nav-icon">≡</span><span>Библиотека</span>
      </button>
      <button class="nav-item" data-view="albums">
        <span class="nav-icon">▦</span><span>Альбомы</span>
      </button>
      <button class="nav-item" data-view="folders">
        <span class="nav-icon">▤</span><span>Папки</span>
      </button>
      <button class="nav-item" data-view="playlists">
        <span class="nav-icon">◈</span><span>Плейлисты</span>
      </button>
      <button class="nav-item" data-view="online">
        <span class="nav-icon">↓</span><span>Интернет</span>
      </button>
    </nav>
    <div class="sidebar-foot">
      <button class="ghost" id="add-folder">Добавить папку</button>
      <div class="hint" id="scan-hint"></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="crumbs" id="crumbs">Библиотека</div>
      <div class="topbar-right">
        <input id="search" class="search" type="search" placeholder="Поиск: трек, исполнитель, альбом" autocomplete="off">
        <select id="sort" class="sort" title="Сортировка">
          <option value="artist">По исполнителю</option>
          <option value="title">По названию</option>
          <option value="album">По альбому</option>
          <option value="year">По году</option>
          <option value="duration">По длительности</option>
          <option value="added">По дате добавления</option>
          <option value="played">По прослушиваниям</option>
        </select>
      </div>
    </header>

    <section class="view" id="view"></section>
  </main>
</div>

<div class="selection-bar" id="selection-bar" hidden>
  <span id="selection-count">Выбрано 0</span>
  <button class="ghost" id="selection-edit">Изменить</button>
  <button class="ghost" id="selection-play">Играть</button>
  <button class="ghost danger" id="selection-delete">Удалить</button>
  <button class="ghost" id="selection-clear">Снять</button>
</div>

<footer class="player" id="player">
  <div class="now" id="now">
    <div class="now-cover" id="now-cover"></div>
    <div class="now-text">
      <div class="now-title" id="now-title">Ничего не играет</div>
      <div class="now-artist" id="now-artist"></div>
    </div>
    <button class="icon-btn now-edit" id="edit-current" title="Метаданные">✎</button>
  </div>

  <div class="controls">
    <div class="buttons">
      <button class="icon-btn" id="shuffle" title="Перемешать"></button>
      <button class="icon-btn" id="prev" title="Предыдущий"></button>
      <button class="play-btn" id="play" title="Играть"></button>
      <button class="icon-btn" id="next" title="Следующий"></button>
      <button class="icon-btn" id="repeat" title="Повтор"></button>
    </div>
    <div class="seek-row">
      <span class="time" id="elapsed">0:00</span>
      <input class="seek" id="seek" type="range" min="0" max="1000" value="0" step="1">
      <span class="time" id="duration">0:00</span>
    </div>
  </div>

  <div class="volume-wrap">
    <button class="icon-btn" id="mute" title="Звук"></button>
    <input class="volume" id="volume" type="range" min="0" max="100" value="80" step="1">
  </div>
</footer>

<div class="nowplaying" id="nowplaying" hidden>
  <div class="np-backdrop" id="np-backdrop"></div>
  <div class="np-backdrop" id="np-backdrop-b"></div>
  <div class="np-exit-zone" id="np-exit-zone" title="Выйти из полноэкранного режима"></div>
  <div class="np-body" id="np-body">
    <div class="np-left">
      <div class="np-cover" id="np-cover"></div>
      <div class="np-info">
        <div class="np-title" id="np-title"></div>
        <div class="np-artist" id="np-artist"></div>
        <div class="np-album" id="np-album"></div>
      </div>
      <canvas class="np-spectrum" id="spectrum" width="520" height="90"></canvas>
      <div class="np-controls">
        <button class="icon-btn" id="np-shuffle" title="Перемешать"></button>
        <button class="icon-btn" id="np-prev" title="Предыдущий"></button>
        <button class="play-btn" id="np-play" title="Играть"></button>
        <button class="icon-btn" id="np-next" title="Следующий"></button>
        <button class="icon-btn" id="np-repeat" title="Повтор"></button>
        <button class="icon-btn on" id="np-lyrics-toggle" title="Показать или скрыть текст"></button>
        <button class="icon-btn" id="np-lyrics-edit" title="Текст песни"></button>
      </div>
      <div class="np-seek-row">
        <span class="time" id="np-elapsed">0:00</span>
        <input class="seek" id="np-seek" type="range" min="0" max="1000" value="0" step="1">
        <span class="time" id="np-duration">0:00</span>
        <button class="icon-btn" id="np-mute" title="Звук"></button>
        <input class="volume np-volume" id="np-volume" type="range" min="0" max="100" value="80" step="1">
      </div>
      <div class="np-actions">
        <button class="ghost" id="np-edit">Изменить метаданные</button>
      </div>
    </div>
    <div class="np-right">
      <div class="np-lyrics" id="np-lyrics"></div>
    </div>
  </div>
</div>

<div class="modal" id="edit-modal" hidden>
  <form class="modal-card" id="edit-form">
    <div class="modal-head">
      <div class="modal-title">Метаданные</div>
      <button type="button" class="icon-btn" id="edit-close" title="Закрыть">✕</button>
    </div>
    <div class="modal-file" id="edit-file"></div>
    <div class="modal-cover">
      <div class="modal-cover-preview" id="edit-cover-preview"></div>
      <div class="modal-cover-actions">
        <button type="button" class="ghost" id="edit-cover-pick">Выбрать обложку…</button>
        <button type="button" class="ghost" id="edit-cover-find">Найти в интернете</button>
        <button type="button" class="ghost" id="edit-cover-remove">Убрать обложку</button>
        <label class="check"><input type="checkbox" id="edit-cover-album"> Ко всему альбому</label>
        <div class="hint" id="edit-cover-hint">JPG или PNG, квадрат от 1000×1000</div>
      </div>
      <input type="file" id="edit-cover-file" accept="image/*" hidden>
    </div>
    <div class="cover-results" id="edit-cover-results" hidden></div>
    <div class="modal-grid" id="edit-fields"></div>
    <div class="hint" id="edit-multi-hint" hidden>Пустые поля означают разные значения — заполните только то, что нужно изменить.</div>
    <div class="modal-actions">
      <button type="button" class="ghost" id="edit-cancel">Отмена</button>
      <button type="submit" class="play-btn modal-save" id="edit-save">Сохранить</button>
    </div>
  </form>
</div>

<div class="modal" id="lyrics-modal" hidden>
  <form class="modal-card" id="lyrics-form">
    <div class="modal-head">
      <div class="modal-title">Текст песни</div>
      <button type="button" class="icon-btn" id="lyrics-close" title="Закрыть">✕</button>
    </div>
    <div class="modal-file" id="lyrics-file"></div>
    <textarea class="lyrics-input" id="lyrics-text" placeholder="Вставьте текст. Для синхронизации с музыкой используйте LRC:&#10;[00:12.34] первая строка&#10;[00:16.00] вторая строка"></textarea>
    <div class="modal-actions">
      <button type="button" class="ghost" id="lyrics-find">Найти в интернете</button>
      <button type="button" class="ghost" id="lyrics-clear">Удалить текст</button>
      <button type="button" class="ghost" id="lyrics-cancel">Отмена</button>
      <button type="submit" class="play-btn modal-save">Сохранить</button>
    </div>
  </form>
</div>

<div class="modal" id="ask-modal" hidden>
  <div class="modal-card ask-card">
    <div class="modal-title" id="ask-title"></div>
    <div class="modal-text" id="ask-text"></div>
    <input class="ask-input" id="ask-input" type="text" autocomplete="off">
    <div class="modal-actions">
      <button type="button" class="ghost" id="ask-cancel">Отмена</button>
      <button type="button" class="play-btn modal-save" id="ask-ok">ОК</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<input type="file" id="upload-files" accept="audio/*,.mp3,.flac,.m4a,.ogg,.opus,.aac,.wav" multiple hidden>
<audio id="audio" preload="metadata"></audio>
<script src="/static/js/api.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
