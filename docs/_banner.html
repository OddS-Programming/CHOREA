<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 1129px; height: 360px; overflow: hidden; }
  body {
    background:
      radial-gradient(900px 420px at 12% 8%, rgba(124, 92, 255, 0.35), transparent 60%),
      radial-gradient(700px 380px at 88% 100%, rgba(74, 222, 128, 0.16), transparent 60%),
      linear-gradient(135deg, #0a0a12 0%, #12101f 55%, #0b0b16 100%);
    color: #f4f4f8;
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    position: relative;
  }
  .grain {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 26px 26px;
    opacity: 0.5;
  }
  .rings { position: absolute; right: -120px; top: -160px; width: 620px; height: 620px; opacity: 0.28; }
  .ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 1px solid rgba(167, 139, 250, 0.55);
  }
  .ring:nth-child(2) { inset: 60px; }
  .ring:nth-child(3) { inset: 120px; }
  .ring:nth-child(4) { inset: 180px; }
  .ring:nth-child(5) { inset: 240px; }
  .content {
    position: relative;
    display: flex; align-items: center; gap: 34px;
    height: 100%; padding: 0 68px;
  }
  .logo {
    width: 148px; height: 148px; border-radius: 34px;
    box-shadow: 0 24px 60px rgba(109, 74, 255, 0.45), 0 0 0 1px rgba(255,255,255,0.08);
  }
  .title {
    font-size: 74px; font-weight: 650; letter-spacing: -1px; line-height: 1;
    background: linear-gradient(100deg, #ffffff 25%, #bda6ff 70%, #8f6bff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin: 0;
  }
  .tagline { margin: 14px 0 0; font-size: 22px; color: #b9b9cb; letter-spacing: 0.2px; }
  .chips { display: flex; gap: 10px; margin-top: 24px; }
  .chip {
    font-size: 13px; color: #d9d4ff; padding: 7px 13px; border-radius: 999px;
    border: 1px solid rgba(167, 139, 250, 0.35); background: rgba(124, 92, 255, 0.12);
  }
  .line {
    position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
    background: linear-gradient(90deg, transparent, #7c5cff 25%, #4ade80 75%, transparent);
    opacity: 0.8;
  }
</style>
</head>
