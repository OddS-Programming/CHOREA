[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "choreia"
version = "1.0.0"
description = "Inspect and rewrite audio tag covers so exactly one picture survives"
requires-python = ">=3.10"
dependencies = [
    "mutagen>=1.47",
    "Pillow>=10",
    "pywebview>=6.2,<7",
    "pythonnet==3.0.5; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "imageio-ffmpeg>=0.5", "pyinstaller>=6"]
gui = ["tkinterdnd2>=0.4"]

[project.scripts]
choreia = "choreia.cli:main"

[project.gui-scripts]
choreia-gui = "choreia.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
